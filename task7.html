<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 7 - Registration Form</title>
</head>

<body>

    <header>
        <h1>Registration Form</h1>
        <p>Please fill in the following information to register.</p>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Personal Information</legend>

                <p>
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" name="full_name" required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" minlength="8" required>
                </p>

                <p>
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone">
                </p>

                <p>
                    <label for="date-of-birth">Date of Birth:</label>
                    <input type="date" id="date-of-birth" name="date_of_birth">
                </p>

                <p>
                    <label for="profile-photo">Profile Photo:</label>
                    <input type="file" id="profile-photo" name="profile_photo" accept="image/*">
                </p>
            </fieldset>

            <fieldset>
                <legend>Course and Study Mode</legend>

                <p>
                    <label for="course">Select Course:</label>
                    <select id="course" name="course">
                        <option value="">-- Select a Course --</option>
                        <option value="web-development">Web Development</option>
                        <option value="graphic-design">Graphic Design</option>
                        <option value="digital-marketing">Digital Marketing</option>
                        <option value="data-science">Data Science</option>
                    </select>
                </p>

                <fieldset>
                    <legend>Study Mode</legend>

                    <p>
                        <input type="radio" id="online" name="study_mode" value="online">
                        <label for="online">Online</label>
                    </p>

                    <p>
                        <input type="radio" id="onsite" name="study_mode" value="onsite">
                        <label for="onsite">On-site</label>
                    </p>

                    <p>
                        <input type="radio" id="hybrid" name="study_mode" value="hybrid">
                        <label for="hybrid">Hybrid</label>
                    </p>
                </fieldset>
            </fieldset>

            <fieldset>
                <legend>Skills</legend>

                <p>
                    <input type="checkbox" id="html" name="skills" value="html">
                    <label for="html">HTML</label>
                </p>

                <p>
                    <input type="checkbox" id="css" name="skills" value="css">
                    <label for="css">CSS</label>
                </p>

                <p>
                    <input type="checkbox" id="javascript" name="skills" value="javascript">
                    <label for="javascript">JavaScript</label>
                </p>

                <p>
                    <input type="checkbox" id="communication" name="skills" value="communication">
                    <label for="communication">Communication</label>
                </p>
            </fieldset>

            <fieldset>
                <legend>Address</legend>

                <p>
                    <label for="address">Address:</label><br>
                    <textarea id="address" name="address" rows="5" cols="40"
                        placeholder="Enter your address"></textarea>
                </p>
            </fieldset>

            <p>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </p>

        </form>
    </main>

</body>
</html>
