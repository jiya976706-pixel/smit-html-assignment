<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images and Figures</title>
</head>

<body>

    <h1>My Image Gallery</h1>

    <p>
        Here are three images that represent nature, learning, and technology.
    </p>

    <figure>
        <a href="images/image1.jpg">
            <img src="images/image1.jpg"
                 alt="Beautiful green landscape with trees"
                 width="400">
        </a>
        <figcaption>Beautiful Green Landscape</figcaption>
    </figure>

    <figure>
        <img src="images/image2.jpg"
             alt="Student studying and learning new skills"
             width="400">
        <figcaption>Learning and Studying</figcaption>
    </figure>

    <figure>
        <img src="images/image3.jpg"
             alt="Modern computer used for web development"
             width="400">
        <figcaption>Technology and Web Development</figcaption>
    </figure>

</body>
</html>
